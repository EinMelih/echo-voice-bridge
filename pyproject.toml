[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "echo-voice-bridge"
version = "0.1.0"
description = "Low-latency, full-duplex voice assistant bridge for rooted Amazon Echo devices"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["aiohttp>=3.10,<4", "numpy>=1.26", "opuslib==3.0.1", "PyNaCl>=1.5,<2", "soxr>=0.5,<1"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
echo-voice-bridge = "echo_voice_bridge.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 140
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["UP041"]
